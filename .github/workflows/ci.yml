name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate Dummy Artifacts
        run: |
          python -c "
          import os
          import joblib
          import numpy as np
          import pandas as pd
          from sklearn.preprocessing import OneHotEncoder
          from sklearn.dummy import DummyClassifier

          os.makedirs('models_artifacts', exist_ok=True)

          # استخراج أسماء الولايات مباشرة من feature_columns الخاصة بمشروعك
          states = [
              'AL', 'AM', 'AP', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 
              'MG', 'MS', 'MT', 'PA', 'PB', 'PE', 'PI', 'PR', 'RJ', 
              'RN', 'RO', 'RR', 'RS', 'SC', 'SE', 'SP', 'TO'
          ]

          encoder = OneHotEncoder(sparse_output=False, handle_unknown='ignore')
          df_states = pd.DataFrame({'customer_state': states})
          encoder.fit(df_states)
          joblib.dump(encoder, 'models_artifacts/encoder.joblib')

          model = DummyClassifier(strategy='most_frequent')
          model.fit(np.array([[1], [0]]), np.array([0, 1]))
          joblib.dump(model, 'models_artifacts/order_lateness_model.joblib')

          print('Dummy artifacts created matching feature_columns exactly!')
          "

      - name: Run tests
        run: pytest tests/test_preprocessing.py -v