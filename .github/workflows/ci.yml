name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate Dummy Artifacts
        run: |
          python -c "
          import os
          import joblib
          import numpy as np
          import pandas as pd
          from sklearn.preprocessing import OneHotEncoder
          from sklearn.dummy import DummyClassifier

          os.makedirs('models_artifacts', exist_ok=True)

          # ضبط الـ Encoder ليعطي Dense Array ومطابق لأسماء الولايات في الاختبار
          encoder = OneHotEncoder(sparse_output=False, handle_unknown='ignore')
          # تدريبه على شكل DataFrame بـ Feature name مثل كود المشروع الحقيقي
          df_states = pd.DataFrame({'customer_state': ['SP', 'RJ', 'MG', 'A', 'B']})
          encoder.fit(df_states)
          joblib.dump(encoder, 'models_artifacts/encoder.joblib')

          model = DummyClassifier(strategy='most_frequent')
          model.fit(np.array([[1], [0]]), np.array([0, 1]))
          joblib.dump(model, 'models_artifacts/order_lateness_model.joblib')

          print('Dummy artifacts updated successfully!')
          "

      - name: Run tests
        run: pytest tests/test_preprocessing.py -v